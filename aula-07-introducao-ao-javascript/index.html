    //const nome = "Sabrina"

    let nome ="Sabrina"
    nome = "Luísa"

    //Exibir no console do site
   // console.log(nome)

    //ESCREVENDO NO SITE

    document.write('Olá'+ nome + '! Vamos aprender sobre variáveis!');

   document.write(`Olá,${nome}! Vamos começar!<br>`);

    let idade = window.prompt('Qual é a sua idade?')

    //CONCATENAÇÃO (TEMPLATE STRINGS)
    document.write(`Àtualmente sua idade é ${idade} anos!<br>`);

   // CONVERSÃO DE DADOS
   const n1 = Number(window.prompt('Digite um número'));
   const n2 = Number(window.prompt('Digite outro número'));

   document.write(`A soma de ${n1} +${n2} é igual a: ${resultado} <br>`)
