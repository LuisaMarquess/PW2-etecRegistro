<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
</body>

<script>
    const n1 = Number(window.prompt('Digite um número'));
    const n2 = Number(window.prompt('Digite outro número'));
    const radd = n1 + n2;
   document.write(`A soma de ${n1} +${n2} é igual a: ${radd} <br>`);

   const rsub = n1 - n2;
   document.write(`A subtração de ${n1} - ${n2} é igual a: ${rsub} <br>`);

   const rmul = n1 * n2;
   document.write(`A multiplicação de ${n1} x ${n2} é igual a: ${rmul} <br>`);

   const rdiv = n1 / n2;
   document.write(`A divisão de ${n1} / ${n2} é igual a: ${rdiv} <br>`);

</script>

</html>
